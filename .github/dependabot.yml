# Keep the GitHub Actions used by the workflows current — their runtimes get
# deprecated roughly yearly (e.g. the Node 20 -> 24 bump), and a dormant repo
# would otherwise silently fail a scheduled deploy. Also the JS dev tools (see
# the npm entry below). The pinned pip deps are left alone on purpose (pandas et al. break across majors,
# and the deploy workflow has no pre-merge test of a bump), so those get bumped
# deliberately, not automatically. Security advisories are handled separately by
# Dependabot alerts (repo Settings), which stay on.
#
# Third-party actions are pinned to a commit SHA, not a tag (CodeQL's
# actions/unpinned-tag): cloudflare/wrangler-action is handed the Cloudflare API
# token, and a tag can be moved to different code after the fact. The trailing
# "# v4.1.3" comment is what Dependabot reads to keep proposing SHA bumps, so
# keep it when editing. GitHub's own actions/* stay on major tags.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # The JS dev tools in package.json (eslint, and the wrangler the deploys use).
  # Unlike the pip pins these are build tools, not runtime dependencies: an
  # eslint bump is checked by the `js` job. A wrangler bump is only exercised by
  # the worker validate job on its PR (Dependabot PRs get no preview deploy), so
  # review those against wrangler's changelog. Grouped into one monthly PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      js-tools:
        patterns: ["*"]
