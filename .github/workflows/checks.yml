name: Static checks

# Lint and type-check every pull request, Python and JS. Its own workflow rather than a step in preview.yml, so
# a lint finding fails a check on the PR without holding back the preview build
# and deploy — the preview is how the change gets reviewed, and a style nit or a
# type complaint shouldn't hide it. Needs no secrets, so it runs the same for forks.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Only the linter, at the version pinned in requirements-dev.txt, so CI and
      # ./ci_env can't disagree. It needs none of the runtime dependencies.
      - name: Install ruff
        run: pip install "$(grep -o '^ruff==[^ ]*' requirements-dev.txt)"

      # Settings live in pyproject.toml. The github format turns findings into
      # inline annotations on the PR diff.
      - name: ruff check
        run: ruff check --output-format=github .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The full dev set: mypy needs the runtime libraries installed (pandas,
      # numpy, bs4) as well as their stubs, to check calls into them.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Settings (files, strictness, the plotly exemption) live in pyproject.toml.
      - name: mypy
        run: mypy

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node from .nvmrc, the one place its version is set (the deploy workflows
      # read it too).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The pinned dev tools from package-lock.json. Install scripts are skipped:
      # nothing here needs one (workerd's only checks its binary), and it keeps a
      # dependency's script from running in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Settings live in eslint.config.js. Correctness rules only, no formatter.
      - name: eslint
        run: npx eslint .

      # The browser code's unit tests, under node's built-in runner.
      - name: node --test
        run: npm test
