name: Static checks

# Lint every pull request. Its own workflow rather than a step in preview.yml, so
# a lint finding fails a check on the PR without holding back the preview build
# and deploy — the preview is how the change gets reviewed, and a style nit
# shouldn't hide it. Needs no secrets, so it runs the same for forks.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Only the linter, at the version pinned in requirements-dev.txt, so CI and
      # ./ci_env can't disagree. It needs none of the runtime dependencies.
      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      # Settings live in pyproject.toml. The github format turns findings into
      # inline annotations on the PR diff.
      - name: ruff check
        run: ruff check --output-format=github .
