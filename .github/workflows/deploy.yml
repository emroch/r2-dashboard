name: Deploy

# Build the dashboard and publish it to Cloudflare Pages. GitHub Actions is the
# only place the Python pipeline runs (pandas + a live fetch); Cloudflare
# just serves (Pages) and routes (a Worker maps emroch.com/r2-dashboard -> Pages).
on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours (00:00/06:00/12:00/18:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/raw/**"           # the fetch-history commit below must not re-trigger
      - "worker/**"             # routing only — worker.yml deploys that, and it
                                # doesn't change the dashboard's contents. A commit
                                # touching worker/ AND src/ still builds, since
                                # paths-ignore only skips when EVERY change matches.

permissions:
  contents: write               # to commit refreshed data/raw caches back

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TZ: America/Chicago           # sensible "as of" / Today dates on the dashboard

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out with the write deploy key, so the cache commit below can push to
      # main. main's ruleset requires the ruff/mypy checks, which also applies to
      # DIRECT pushes, and a bot commit has no checks — so a push with the default
      # GITHUB_TOKEN is rejected. Deploy keys are the ruleset's one bypass actor.
      # If the DEPLOY_KEY secret is unset this input is empty and checkout falls
      # back to the token, i.e. exactly the old behaviour.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip                       # cache the pip wheel downloads...
          cache-dependency-path: requirements.txt   # ...keyed on the pinned deps

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard (fetch -> clean -> render)
        run: python3 src/pipeline.py

      - name: Stage deploy directory
        run: |
          mkdir -p dist
          cp output/r2_orders_dashboard.html dist/index.html
          cp data/processed/r2_orders_clean.csv dist/r2_orders_clean.csv
          cp data/processed/r2_dimensions.json dist/r2_dimensions.json
          cp data/processed/r2_series.json dist/r2_series.json
          cp data/processed/r2_view.json dist/r2_view.json
          cp -R output/assets dist/assets
          cp src/templates/_headers dist/_headers

      - name: Persist fetch history
        # Commit any new data/raw caches BEFORE deploying: dist/, output/ and
        # data/processed/ are gitignored, so once data/raw is committed the tree
        # is clean at deploy time. That silences wrangler's "uncommitted changes"
        # warning and lets it tag the deployment with this commit. The empty-diff
        # guard + paths-ignore + [skip ci] keep this from triggering another run.
        # Pushes over SSH with the deploy key from the checkout step, which is what
        # gets this commit past main's required checks.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || (git commit -m "data: refresh caches [skip ci]" && git push)

      # wrangler is pinned in package.json. Installed before the deploy action,
      # which then finds it and uses it instead of running its own `npm i
      # wrangler` in the checkout (which rewrote package.json and dirtied the tree).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install wrangler (pinned in package.json)
        run: npm ci --ignore-scripts

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=r2-dashboard --branch=main
