# R2 Orders — chart fills.
#
# Colors that don't name a category: the single-series bar and histogram tints
# and accents. Every CATEGORY color (paints, wheels,
# interiors, regions, trims, delivery types, R1 models) lives with its category
# in dimensions.yaml, which is also what the presentation layer reads.
# Loaded by config.py at import via yaml.safe_load.

# ---------------------------------------------------------------------------
# Chart roles: colors that don't stand for anything real (unlike a paint), named
# by the job they do, so re-theming the charts is an edit here.
#   primary         the chart color: the stage charts' columns (stepped by stage),
#                   the reservation timeline, coverage, price bars, order markers
#   highlight       Compass Yellow, "the summary, not a data point": the weekly
#                   median, the build front and its projection, option spend and
#                   the median price; it isn't a paint, so it reads over them
#   highlight_band  the highlight as a translucent band (the build front's error)
# A hovered column lights up in the stat-card yellow (theme.yaml stat-bg).
# ---------------------------------------------------------------------------
chart:
  primary: "#4c78a8"
  highlight: "#ffb100"
  highlight_band: "rgba(243, 174, 61, 0.18)"

# ---------------------------------------------------------------------------
# Fulfilment over time (§delivery-progress), its weekly view: one line per pipeline event. Order
# placed in orange; the rest step toward delivery.
# ---------------------------------------------------------------------------
fulfilment:
  placed: "#f58518"
  vin: "#4c78a8"
  scheduled: "#72b7b2"
  delivered: "#54a24b"
