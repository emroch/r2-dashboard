# R2 Orders — chart fills.
#
# Colors that don't name a category: the single-series bar and histogram tints
# and accents. Every CATEGORY color (paints, wheels,
# interiors, regions, trims, delivery types, R1 models) lives with its category
# in dimensions.yaml, which is also what the presentation layer reads.
# Loaded by config.py at import via yaml.safe_load.

# ---------------------------------------------------------------------------
# Single-series chart fills. Unlike the vocab above these don't encode a
# category (one color per whole series) — they just tint a bar or histogram —
# but they live here so every data color is in one place.
# ---------------------------------------------------------------------------
timeline:                     # reservation / order timeline (chart 6)
  ordered: "#f58518"          # converted reservations + orders by week
  reserved_only: "#4c78a8"    # outstanding reservations

# ---------------------------------------------------------------------------
# Order-to-delivery time (latency chart). The same three hues the page already
# uses: the shared chart blue for individual orders, Compass Yellow for the
# emphasized summary (the weekly median), and the neutral grey for the coverage
# bars underneath, which are context rather than a finding.
# ---------------------------------------------------------------------------
latency:
  order: "#4c78a8"            # one marker per order with a firm delivery date
  median: "#f3ae3d"           # Compass Yellow — weekly median line
  coverage: "#9aa9b8"         # share of each week's orders shown above

# ---------------------------------------------------------------------------
# Build front + projection overlaid on the delivery-vs-VIN scatter (§10), and the
# cadence-over-time companion. The scatter's markers are paint colors, so the
# overlay needs a hue that isn't a paint and reads on both surfaces: Compass
# Yellow, the page's accent for "the summary, not a data point".
# ---------------------------------------------------------------------------
cadence:
  front: "#f3ae3d"                     # observed weekly build front (solid)
  projection: "#f3ae3d"                # projected front (dashed)
  band: "rgba(243, 174, 61, 0.18)"     # back-tested error band around it

# ---------------------------------------------------------------------------
# Configured-price charts: the neutral bar fill plus a Compass Yellow accent for
# the emphasized series (option spend) and the highlighted median. The accent is
# the same yellow the page uses for stat cards and the disclaimer border, so the
# charts read as part of the same design rather than introducing a new hue.
# ---------------------------------------------------------------------------
price:
  bar: "#4c78a8"              # price distribution bars, per-trim boxes
  accent: "#f3ae3d"           # Compass Yellow — option spend, median highlight
