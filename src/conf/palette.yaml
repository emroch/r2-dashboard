# R2 Orders — color & marker configuration.
#
# The single place to edit the dashboard's color/marker vocabulary. Adding a new
# paint, interior, region, or delivery-type is a data edit here — no code change.
# Loaded by config.py at import via yaml.safe_load.

# ---------------------------------------------------------------------------
# Exterior paints (representative, adjusted for digital display)
# ---------------------------------------------------------------------------
paints:
  Catalina Cove:  "#4a8db4"  # dark teal-blue
  Launch Green:   "#91aa81"  # muted olive
  Forest Green:   "#226222"  # dark green
  Borealis:       "#6447ac"  # deep purple
  Half Moon Grey: "#666666"  # dark warm grey
  Esker Silver:   "#AAAAAA"  # cool silver
  Glacier White:  "#F2F2F2"  # near-white
  Midnight:       "#000009"  # black

# Legend / axis ordering for the paints above.
paint_order:
  - Catalina Cove
  - Launch Green
  - Forest Green
  - Borealis
  - Half Moon Grey
  - Esker Silver
  - Glacier White
  - Midnight

# ---------------------------------------------------------------------------
# Interiors. Keyed by the EXACT sheet value, because "Black Crater" and "Black
# Crater Signature" are DIFFERENT offerings in pricing.yaml — Standard gets the
# plain one, Performance and Premium the Signature. Shortening a label by
# stripping the suffix would merge the two into one row the moment Standard ships,
# so the display label is recorded here instead of derived.
#   short — display label; kept compact, it appears in dense axes and row keys
#   color — the cabin color, used by every interior chart (take-rate bars and the
#           stacked mix alike). Sampled from Rivian's configurator renders with a
#           canvas pixel median rather than picked by eye:
#             Black Crater Signature  seat back #48433c, centre console #58554f
#             Coastal Cloud Signature seat back #b3b1ad, centre console #c7c6c4
#             Black Crater (plain)    headliner #918f8c / #8c8b87
#
# Why plain Black Crater takes its HEADLINER rather than its seats: below the
# beltline it is the same charcoal as the Signature (seat back #524e48, console
# #58554f — indistinguishable), and averaging its two-tone cabin lands right back
# on the Signature's value. The light headliner and fabric dash are the only
# things that separate them, so the swatch carries the upper cabin. If that ever
# reads as wrong, the alternative is same-charcoal-plus-a-fabric-hatch pattern.
#
# None of these three survives both chart surfaces on its own — the charcoal is
# ~2:1 against the dark card and the smoke ~1.8:1 against the light one. Every
# interior chart therefore draws a segment border in CHART.edge, which the theme
# flips (#2b2b2b light / #aab0b8 dark) and so always contrasts whichever surface
# is showing. That is also why these beat the near-black/near-white pair they
# replaced, which sat at ~1.2:1 against their weak surface.
# Listed plainest-first, which is the order the charts show them in.
# ---------------------------------------------------------------------------
interiors:
  'Black Crater':
    short: 'Black Crater'
    color: "#8f8d89"          # light headliner — see note above
  'Black Crater Signature':
    short: 'Black Crater Sig'
    color: "#57514a"          # warm charcoal upholstery
  'Coastal Cloud Signature':
    short: 'Coastal Cloud Sig'
    color: "#c2c0bb"          # light smoke upholstery

# ---------------------------------------------------------------------------
# Wheels. Keyed by the EXACT sheet value (note the curly ” the form uses), so a
# wheel is identified rather than inferred from its size — the R2 has four wheels
# and two of them are 20", so a size test can't tell them apart. Each trim offers
# two (see pricing.yaml); only the Performance pair appears in the data until
# Premium and Standard ship, and the charts show only the wheels present.
#   short  — display label (legends, hovers, take-rate rows)
#   abbr   — compact label for dense axes; size + All-Season/All-Terrain, which
#            is unique across all four and is the distinction people argue about
#   symbol — Plotly marker, dual-encoding with paint color on the scatter charts
#   color  — fill for the wheel-mix bars. Listed in ascending size, which is the
#            stack order; validated for CVD separation and contrast in both
#            light and dark against that order.
# ---------------------------------------------------------------------------
wheels:
  '19” Machined Graphite All-Season':
    short: '19" Machined Graphite'
    abbr: '19" AS'
    symbol: triangle-up
    color: "#2f8f6b"
  '20” Bicolor Carbon All-Season':
    short: '20" Bicolor Carbon'
    abbr: '20" AS'
    symbol: square
    color: "#8f4a9c"
  '20” Black Sand All-Terrain':
    short: '20" Black Sand'
    abbr: '20" AT'
    symbol: diamond
    color: "#c96a10"
  '21” Liquid Tungsten All-Season':
    short: '21" Liquid Tungsten'
    abbr: '21" AS'
    symbol: circle
    color: "#3070b3"

# ---------------------------------------------------------------------------
# Region -> color (geographic demand maps + destination chart).
# ---------------------------------------------------------------------------
regions:
  West: "#e94747"
  Midwest: "#5096e1"
  South: "#f58518"
  Northeast: "#4fb843"
  Canada: "#9467bd"

# ---------------------------------------------------------------------------
# Delivery-estimate certainty -> color + marker opacity. `unknown` covers rows
# with no parseable estimate. Opacities are all 1.0 today (previously the vaguer
# types were faded; kept here so re-fading is a one-line tweak).
# ---------------------------------------------------------------------------
delivery_types:
  explicit: {color: "#1f77b4", opacity: 1.0}
  window:   {color: "#ff7f0e", opacity: 1.0}
  range:    {color: "#2ca02c", opacity: 1.0}
  month:    {color: "#9467bd", opacity: 1.0}
  unknown:  {color: "#bbbbbb", opacity: 1.0}

# Stack / iteration order for the firm->vague delivery types (excludes unknown).
delivery_type_order: [explicit, window, range, month]

# ---------------------------------------------------------------------------
# Single-series chart fills. Unlike the vocab above these don't encode a
# category (one color per whole series) — they just tint a bar or histogram —
# but they live here so every data color is in one place.
# ---------------------------------------------------------------------------
take_rate:                    # config take-rate bars (chart 4)
  wheels: "#4c78a8"
  buylease: "#f58518"
  spare: "#e45756"
  r1_owner: "#54a24b"
  interior_fallback: "#8899a6"  # interior not found in `interiors` above

timeline:                     # reservation / order timeline (chart 6)
  ordered: "#f58518"          # "reserved & ordered" bars + order-date bars
  reserved_only: "#4c78a8"    # reservation-only (incomplete) bars

heatmap_colorscale: Blues     # color x wheels combo heatmap (chart 5)

# ---------------------------------------------------------------------------
# Per-state totals bars: a delivery pipeline that stacks to each state's order
# count — inferred-delivered, then still awaiting delivery split by whether a VIN
# is known. Encodes progress (not region), so it deliberately sits outside the
# `regions` palette above.
#
# Deliberately the same three hues the rest of the page already uses, so the
# dashboard reads as one system: Compass Yellow for the series being highlighted
# (as in the price charts), the shared chart blue beneath it, and the same muted
# grey the take-rate chart uses for "nothing reported yet".
# ---------------------------------------------------------------------------
state_totals:
  delivered: "#f3ae3d"        # Compass Yellow — matches the price-chart accent
  vin: "#4c78a8"              # the shared chart blue (price bars, take-rate wheels)
  no_vin: "#c2ccd6"           # the take-rate "No / unspecified" grey

# ---------------------------------------------------------------------------
# Configured-price charts: the neutral bar fill plus a Compass Yellow accent for
# the emphasized series (option spend) and the highlighted median. The accent is
# the same yellow the page uses for stat cards and the disclaimer border, so the
# charts read as part of the same design rather than introducing a new hue.
# ---------------------------------------------------------------------------
price:
  bar: "#4c78a8"              # price distribution bars, per-trim boxes
  accent: "#f3ae3d"           # Compass Yellow — option spend, median highlight

# ---------------------------------------------------------------------------
# Trim -> color, for the take-rate panels that stack by trim (chart 2). A light
# to dark ramp from the entry trim up to Performance, keyed to the same blue the
# price charts use. Only drawn once more than one trim has orders.
# ---------------------------------------------------------------------------
trims:
  Standard:    "#a8c6e0"
  Premium:     "#4c78a8"
  Performance: "#2a4a6b"

# ---------------------------------------------------------------------------
# Which R1 the owner has -> color, for the R1-owner panel's stack. Greens to
# match that panel's existing bar. The grey segment covers everyone with no model
# named, which is almost entirely non-owners (the question is conditional), so it
# is labelled for that case rather than as a bare "unspecified".
# ---------------------------------------------------------------------------
r1_models:
  R1T:               "#54a24b"
  R1S:               "#8fbf6f"
  Both:              "#2f6b2f"
  "No / unspecified": "#c2ccd6"
