# yaml-language-server: $schema=overrides.schema.json
# Manual curation, applied after fetch and before cleaning. Every section is keyed
# by Username (case-insensitive), or username#2 (#3, ...) for one of a user's
# several orders. overrides.schema.json is the field-by-field reference, with
# every field's type and form; the build validates this file against it and stops
# on anything that doesn't fit. Editors with the YAML language server (VS Code's
# YAML extension) read the line above and complete and check fields as you type.
#
#   overrides:  edit fields on an order ALREADY in the orders sheet — someone
#               posted more detail in the forum but didn't update the sheet. Only
#               the fields given change. A username with no matching order, or a
#               value the sheet already holds, is reported.
#   additions:  an order NOT in the sheet (forum-only). Give what has been
#               reported; a field left out is unknown, and charts as Unknown. An
#               unreported paint, wheels or interior leaves the order unpriced.
#               A username already in the sheet is reported (use overrides).
#   deletions:  drop an entry that no longer exists — a cancellation, or a stale
#               resubmission — under `orders` or `reservations` (separate sheets).
#               Nothing in the data marks a cancellation, so the forum post is the
#               evidence and the reason is shown in the data-quality panel. Prefer
#               a `match` scoping it to ONE entry: a username is not a stable key,
#               and a later order under the same name then fails the match and is
#               reported, instead of silently removed. Deleting an order also keeps
#               the person out of the outstanding reservations.
#   verified:   values that LOOK like entry errors but have been confirmed, so the
#               checks in ingest/outliers.py stop setting them aside: `fields`,
#               any of vin, delivery.
#
# Every entry records where it came from (ingest/curation.py):
#   source:   a forum URL (or a list of them), or "inferred — <why>"
#   as_of:    when we learned it — the post, or the curation date. Later sheet
#             changes are compared against it (the stale-override check). Not
#             needed on an entry that only gives milestone dates.
#   checked:  optional; a later date on which the entry was re-checked against
#             the sheet and still holds
#   reason:   optional short note
#
# Values. Dates are ISO and unquoted: 2026-08-18, or 2026-08 when only the month
# is known, or unknown. The VIN is quoted, so a leading zero survives, and may be
# partly hidden ("123XX"). Config values are written as the sheet writes them.
# To record that something has become unknown, write unknown — leaving a field
# out of an override leaves the sheet's value standing.
#   dates:
#     resv_date, order_date          a day, a month, or unknown
#     vin_assigned                   milestone: when the FINAL VIN was assigned
#     delivery_scheduled             milestone: when the FINAL delivery date was set
#     delivery                       the estimate, one of:
#       2026-08-18                     a firm date
#       2026-10                        some time that month
#       {between: [2026-10-10, 2026-10-24]}
#       {weeks: [4, 8]}                counted from the order date; also {weeks: 6},
#       {weeks: [2, 4], from: 2026-09-01}   {days: ...}; `from` when given later
#       unknown
#   Without a milestone date, it's the first snapshot that showed the final value;
#   one that can't fit (before the order, after the sheet already showed it, ...)
#   is listed, not used. An entry may carry only milestones, to date values the
#   sheet already has right.
#
# Keep each section sorted by username; ./tools/migrate_curation.py --write puts
# the file back in order (and canonical form), carrying each comment with the
# entry below it, and a test fails if it isn't. The applied changes and every
# problem show in the cleaning report and the data-quality panel.
#
# overrides:
#   SomeUser:
#     source: https://www.rivianforums.com/forum/posts/1234567/
#     as_of: 2026-07-30
#     vin: "1234"
#     dates:
#       vin_assigned: 2026-07-28
#       delivery: 2026-08-14
# additions:
#   ForumOnlyUser:
#     source: https://www.rivianforums.com/forum/posts/1234568/
#     as_of: 2026-08-02
#     location: "CA"
#     dates:
#       order_date: 2026-07-01
#       delivery: {weeks: [4, 8]}
#     config:
#       trim: "Performance"
#       color: "Launch Green"
# deletions:
#   orders:
#     SomeUser:
#       source: https://www.rivianforums.com/forum/posts/1234569/
#       as_of: 2026-08-24
#       reason: "cancelled by user (2026-08-24)"
#       match:
#         order_date: 2026-07-01

