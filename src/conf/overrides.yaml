# Manual curation — corrections and forum-only orders applied after fetch,
# before cleaning. Both sections are keyed by Username (case-insensitive) and
# flow through the normal cleaning (VIN recovery, date parsing, geo, etc.):
#
#   overrides:  edit one or more RAW fields on a person ALREADY in the orders
#               sheet. Use when someone posted more detail in the forum but did
#               not update the sheet. A username with no matching order is
#               reported as an issue.
#   additions:  append a forum-only order NOT in the sheet (a whole new row).
#               Give as many raw fields as you have. A username already in the
#               sheet is reported as an issue (use overrides for those instead).
#   deletions:  drop an entry that no longer exists — someone posted that they
#               cancelled. Split into `orders` and `reservations` because the two
#               sheets are separate. Nothing in the data marks a cancellation, so
#               the forum post is the only evidence and belongs in the file.
#               The value is either a reason string, or `reason` plus a `match` of
#               raw field -> value scoping it to ONE entry. Prefer the scoped form:
#               a username is not a stable key for an order, so if someone cancels
#               and later orders again under the same name, an unscoped deletion
#               silently removes the new order too. Matching the cancelled order's
#               date means a replacement fails the match and the stale entry is
#               reported instead of suppressing a live order.
#               A username with no matching row — or one whose rows no longer pass
#               the matcher — is reported as an issue: once the sheet moves on, the
#               entry here is dead weight, and silence would keep it forever.
#               Deleting an ORDER also keeps that person out of the reservations
#               cohort — leaving the orders sheet must not make them resurface as
#               an outstanding reservation. All of a cancelled name's rows go
#               together, so a duplicate submission can't half-survive.
#
# A field written with NO VALUE is blank, and blank means UNKNOWN — the same thing
# an unanswered question in the sheet produces, so it flows into the existing
# unknown buckets. It does NOT mean the string "None" (it used to: YAML reads an
# empty key as null, and str(None) is the word — issue #49). What blank does
# depends on the section, because the two are asking different questions:
#
#   in additions:  expected and harmless — the entry IS the row, so a field nobody
#                  has reported yet is simply unknown. Paint/wheels/interior chart
#                  as an explicit "Unknown", and because every R2 has all three, an
#                  unreported one leaves the order UNPRICED rather than priced as
#                  though the no-cost option had been picked.
#   in overrides:  ignored, and reported. An override edits a row that already has
#                  data, so honouring a blank would erase what the sheet says on the
#                  strength of an empty line. To record that something has genuinely
#                  become unknown, write "unknown" — the parsers understand it.
#
#   verified:   values that LOOK like entry errors but have been confirmed, so the
#               checks in ingest/outliers.py stop setting them aside. Username ->
#               list of the raw fields confirmed: vin_raw, delivery_raw. A held-
#               back car with a very low VIN, say, once the owner has confirmed it.
#
# PROVENANCE (curation_version 2, ingest/curation.py). Every entry in every section
# also carries:
#   source:  the forum URL (or a list of them), or "inferred — <why>" for a
#            judgment made from the data itself
#   as_of:   "YYYY-MM-DD", when we learned it: the post, or the curation date.
#            The stale-override check compares later sheet changes against it.
#   reason:  optional short note
#   checked: optional "YYYY-MM-DD", a later date on which someone re-checked an
#            override against the sheet and it still holds. The "sheet changed
#            after this override" warning then only counts changes after it.
#   dates:   optional milestone dates for the order's FINAL values (#99), from a
#            post that says when they happened:
#              vin_assigned:        when the final VIN was assigned
#              delivery_scheduled:  when the final delivery date was set
#            Without them, each is the first snapshot that showed the final
#            value. An entry may carry only `dates`, to date values the sheet
#            already has right. A date that can't fit (before the order, after
#            the sheet already showed the value, ...) is listed, not used.
# Once the file says `curation_version: 2`, a missing source or as_of stops the
# build. tools/migrate_curation.py converts the older comment-only format. Use
# `username#2` (#3, ...) as the key to target one of a user's several orders.
#
# Version-controlled and auditable: every applied change/addition/deletion — and
# every problem (unknown field / no matching or already-present user) — shows in
# the cleaning report and the data-quality panel. Idempotent; never mutates the cache.
#
# Valid fields: orig_num, user, resv_raw, order_raw, vin_raw, delivery_raw,
# buylease, loc_raw, trim, launch, color, interior, wheels, autonomy, tow, spare,
# r1_owner, r1_model. (These are the columns schema.yaml maps; a field it doesn't
# read — "will you keep your R1", "other vehicles owned" — is reported as unknown.)
#
# Example (commented out):
# overrides:
#   SomeUser:
#     vin_raw: "1234"            # forum-confirmed VIN, missing from the sheet
#     delivery_raw: "7/30/2026"  # posted a firm date after submitting
# additions:
#   ForumOnlyUser:
#     vin_raw: "1500"
#     delivery_raw: "8/1/2026"
#     loc_raw: "CA"
#     color: "Launch Green"
# deletions:
#   orders:
#     SomeUser: "cancelled the order — https://... (2026-08-24)"
#   reservations:
#     AnotherUser: "cancelled the reservation — https://..."

curation_version: 2

