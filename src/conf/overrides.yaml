# Manual curation — corrections and forum-only orders applied after fetch,
# before cleaning. Both sections are keyed by Username (case-insensitive) and
# flow through the normal cleaning (VIN recovery, date parsing, geo, etc.):
#
#   overrides:  edit one or more RAW fields on a person ALREADY in the orders
#               sheet. Use when someone posted more detail in the forum but did
#               not update the sheet. A username with no matching order is
#               reported as an issue.
#   additions:  append a forum-only order NOT in the sheet (a whole new row).
#               Give as many raw fields as you have. A username already in the
#               sheet is reported as an issue (use overrides for those instead).
#   deletions:  drop an entry that no longer exists — someone posted that they
#               cancelled. Split into `orders` and `reservations` because the two
#               sheets are separate; the value is the reason, and should carry the
#               source link. Nothing in the data marks a cancellation, so the
#               forum post is the only evidence and belongs in the file.
#               A username with no matching row is reported as an issue: once the
#               sheet drops the row itself the entry here is dead weight, and
#               staying silent would keep it forever.
#               Deleting an ORDER also keeps that person out of the reservations
#               cohort — leaving the orders sheet must not make them resurface as
#               an outstanding reservation.
#
# Version-controlled and auditable: every applied change/addition/deletion — and
# every problem (unknown field / no matching or already-present user) — shows in
# the cleaning report and the data-quality panel. Idempotent; never mutates the cache.
#
# Valid fields: orig_num, user, resv_raw, order_raw, vin_raw, delivery_raw,
# buylease, loc_raw, trim, launch, color, interior, wheels, autonomy, tow, spare,
# r1_owner, r1_model. (These are the columns schema.yaml maps; a field it doesn't
# read — "will you keep your R1", "other vehicles owned" — is reported as unknown.)
#
# Example (commented out):
# overrides:
#   SomeUser:
#     vin_raw: "1234"            # forum-confirmed VIN, missing from the sheet
#     delivery_raw: "7/30/2026"  # posted a firm date after submitting
# additions:
#   ForumOnlyUser:
#     vin_raw: "1500"
#     delivery_raw: "8/1/2026"
#     loc_raw: "CA"
#     color: "Launch Green"
# deletions:
#   orders:
#     SomeUser: "cancelled the order — https://... (2026-08-24)"
#   reservations:
#     AnotherUser: "cancelled the reservation — https://..."

