# Data schema: how the source sheets map to internal fields, plus the fetch
# sources, sanitization bounds, and option take-rate vocabulary.

# CSV export + human "view" URL templates (first %s = sheet key, second = gid).
export_url: "https://docs.google.com/spreadsheets/d/%s/export?format=csv&gid=%s"
view_url: "https://docs.google.com/spreadsheets/d/%s/preview?gid=%s"

# The two live Google Sheets. `slug` names the local cache files in data/raw/.
sources:
  orders:
    key: "13dsTsw06i7C-pEfqGxh3e9Bl1EYxS4pIelrHrCaLZYk"
    gid: "0"
    label: "Orders & Deliveries sheet"
    slug: "r2_orders_live"
  reservations:
    key: "1Z_TSfn1eR580_ZBrTMGvO60-iKnEP8ZMKKC4q2Yv9Po"
    gid: "0"
    label: "Reservations sheet"
    slug: "r2_reservations_live"

# Orders sheet: a fixed block of columns starting at the "#" column (the header
# row is the one containing "Username"). Maps internal field name -> the exact
# sheet header text, in sheet order: the order and length define the block, and
# the header text is verified against the sheet on every run (schema_check.py).
# These columns are read BY POSITION, so a rename/reorder/insert/remove in the
# sheet would mis-map every field it shifts and silently corrupt every number —
# the check stops the pipeline instead. If the sheet legitimately changes, edit
# this map to match it (that is the only fix needed).
orders_columns:
  orig_num:       "#"
  user:           "Username"
  resv_raw:       "Original Reservation Date"
  order_raw:      "R2 Order Date"
  vin_raw:        "VIN Assigned"
  delivery_raw:   "Estimated Delivery Date / Window"
  buylease:       "Purchase or Lease?"
  loc_raw:        "Location"
  trim:           "Trim"
  launch:         "Launch Package"
  color:          "Color"
  interior:       "Interior"
  wheels:         "Wheels"
  autonomy:       "Autonomy+ Option Added"
  tow:            "Tow Package Added"
  spare:          "Compact Spare Tire Added"
  r1_owner:       "Are you a current Rivian R1 owner?"
  r1_keep:        "If you are a current R1 owner, will you be keeping your R1 and adding an R2?"
  r1_model:       "If you are a current R1 owner, which model?"
  other_vehicles: "Other vehicles currently owned"

# Reservations sheet: mapped by header NAME (its layout differs), so its column
# order is immaterial — but each header below must appear exactly once, since a
# missing one would read as empty for every row and a repeated one is ambiguous.
reservations_columns:
  orig_num: "#"
  user: "Username"
  resv_raw: "R2 reservation date"
  loc_raw: "Location"

# Columns that exist in a sheet but are deliberately not read. Listing them keeps
# the drift check quiet about the known extras while still reporting any NEW
# unmapped column in the data-quality panel — which usually means the form gained
# a question worth charting. Empty header cells (spacers, trailing commas) never
# need listing. The orders block is complete, so it has no known extras.
ignored_columns:
  orders: []
  reservations:
    - "Are you a current Rivian R1 owner?"
    - "If you are a current R1 owner, will you be keeping your R1 and adding an R2?"
    - "If you are a current R1 owner, which model?"
    - "Other vehicles currently owned"

# Sanitization bounds. The upper bound for dates is always "today" (AS_OF).
sanitize:
  order_date_min: "2026-06-09"        # R2 ordering opened
  reservation_date_min: "2024-03-07"  # R2 reveal / reservations opened
  order_anchor_min: "2026-01-01"      # order dates below this don't anchor windows
  vin_seq_min: 100                    # VIN sequence below this = unusable/redacted
  # Plausible year window for a parsed DELIVERY estimate. A typo can parse
  # cleanly but land centuries off ("8/1326", meant 8/13/26, reads as year 1326);
  # anything outside this window is treated as unparseable and flagged in the
  # data-quality panel rather than plotted.
  delivery_year_min: 2024
  delivery_year_max: 2035

# Option take-rate vocabulary (values compared lowercased).
options:
  opted_in_tokens: ["yes", "included"]  # Autonomy+ / Tow: count these as opted-in
  spare_tokens: ["yes"]                 # Compact spare: only explicit "yes"
  wheels_21_contains: "21"              # wheels text containing this = 21" trim

# Option availability: the earliest date each not-yet-released trim / paint /
# interior could actually be ordered. An order whose R2 order date precedes the
# availability of ANY option it selected can't be a confirmed order (the config
# wasn't buildable yet), so the whole row is DROPPED — not merely date-nulled —
# and surfaced in the cleaning report + the data-quality panel.
#
# Keys are matched case-insensitively as a PREFIX of the sheet value, so "Standard"
# covers "Standard AWD" / "Standard RWD LR" / "Standard RWD" and "Premium" covers
# "Premium AWD"; "Performance" (the launch trim) is unaffected. Use "unreleased"
# for an option with no announced date — every order for it is dropped until a
# real date is set here. This is self-maintaining: as each option ships, its
# genuine orders naturally post-date its availability and are kept automatically,
# so entries only ever leave this list — there are no per-user overrides to chase.
availability:
  trim:
    Premium: unreleased
    Standard: unreleased
  color:
    Forest Green: "2026-08-31"
    Borealis: "2026-09-30"
  interior:
    Coastal Cloud Signature: "2026-08-31"
