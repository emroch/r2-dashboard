# Bin edges for the reference panels (below the first edge forms the lowest bar,
# at-or-above the last edge the highest). Chosen to spread the current cohort
# across four bars rather than to round numbers; widen or add an edge here if a
# bar empties out. Density edges are spaced roughly geometrically, since state
# density spans three orders of magnitude.
state_reference_bins:
  elevation_ft: [500, 1500, 3500]
  temperature_f: [45, 52, 60]
  density_per_sq_mi: [50, 150, 400]
