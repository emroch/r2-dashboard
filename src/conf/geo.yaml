# ---------------------------------------------------------------------------
# Per-state terrain + climate, for the "wheel preference by location" panels.
# state -> [mean_elevation_ft, mean_annual_temp_f]
#
# APPROXIMATE PUBLISHED FIGURES, not measurements from this dataset: USGS mean
# state elevation (area-weighted) and NOAA 1991-2020 statewide average annual
# temperature. Both are rounded. Correcting one is a data edit here, nothing more.
#
# On the choice of statistic: elevation is the AREA-WEIGHTED MEAN, which is the
# standard published figure and is robust to a lone tall peak — a summit covers
# negligible area, so Washington's Mt. Rainier (14,411 ft) leaves WA at ~1,700 ft.
# Two measures that sound better are worse: relief (high point - low point) is
# defined purely by two extreme points, which would rank California the most
# mountainous state in the country off Whitney and Badwater alone; and median
# elevation, while more robust still, is not a published figure — it needs a
# digital elevation model.
#
# The real limitation is different, and the charts say so: this is terrain
# elevation, not where people live. Population-weighted elevation is the measure
# that actually fits "do buyers at altitude choose all-terrains", and it differs
# most exactly where the orders are — California's terrain mean is ~2,900 ft while
# most Californians live near sea level. Read the elevation panel as a weak proxy.
#
# Canadian provinces are deliberately absent: provincial averages span too much
# ground to mean anything (BC alone runs from rainforest coast to alpine
# interior), and inventing them would look like data. Orders there fall into an
# explicit "no data" bar instead of being dropped or guessed at.
