# ---------------------------------------------------------------------------
# Per-state reference figures, for the "wheel preference by location" panels.
# state -> [mean_elevation_ft, mean_annual_temp_f, people_per_sq_mi]
#
# APPROXIMATE PUBLISHED FIGURES, not measurements from this dataset: USGS mean
# state elevation (area-weighted), NOAA 1991-2020 statewide average annual
# temperature, and Census resident population per square mile of land area. All
# rounded. Correcting one is a data edit here, nothing more.
#
# These are all STATE AVERAGES, and the dashboard only knows an order's state, so
# every panel built on them is a weak proxy. Each is weak in its own way:
#
# elevation — the area-weighted mean is the standard figure and is robust to a
#   lone tall peak, since a summit covers negligible area (Mt. Rainier leaves WA
#   at ~1,700 ft). Two alternatives that sound better are worse: relief (high
#   point - low point) is defined purely by two extremes, which would rank
#   California the most mountainous state in the country off Whitney and Badwater
#   alone; median elevation is more robust still but is not published — it needs a
#   digital elevation model. The real gap is that terrain elevation is not where
#   people live: California's terrain mean is ~2,900 ft while most Californians
#   live near sea level, and California is about a fifth of the cohort.
#
# density — raw density divides by the WHOLE state, so a big state with one metro
#   reads as rural even when almost nobody lives rurally. Nevada is 28/sq mi and
#   about 94% urban; Arizona, Utah, Colorado and Idaho are the same shape, and
#   together they are a meaningful slice of this cohort's West. Percent-urban
#   population, or Census population-weighted ("perceived") density, fixes exactly
#   this and would be the better figure if these panels ever need to carry weight.
#   DC is a city rather than a state and sits ~11,000/sq mi; the top bin holds it.
#
# temperature — a statewide annual mean flattens both altitude and season, so a
#   Flagstaff order and a Phoenix order are charted at the same 60F.
#
# Canadian provinces are deliberately absent: provincial averages span too much
# ground to mean anything (BC alone runs from rainforest coast to alpine
# interior), and inventing them would look like data. Orders there fall into an
# explicit "no data" bar instead of being dropped or guessed at.
