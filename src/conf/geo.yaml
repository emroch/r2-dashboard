# ---------------------------------------------------------------------------
# Per-state reference figures, for the "wheel preference by location" panels.
# state -> [mean_elevation_ft, mean_annual_temp_f, percent_urban]
#
# Published figures, not measurements from this dataset. Independently verified
# against the sources below; correcting a value is a data edit here, nothing more.
#
#   elevation   USGS mean state elevation, area-weighted, rounded.
#               https://pubs.usgs.gov/pp/1200us/report.pdf
#   temperature NOAA Climate at a Glance statewide annual (Jan-Dec) mean over the
#               1991-2020 normals period. State the method when checking these:
#               an earlier set of values here reproduced under no method at all
#               and had to be replaced wholesale.
#               https://www.ncei.noaa.gov/access/monitoring/climate-at-a-glance/
#   percent     Census 2020 urban/rural workbook, share of state population in
#     urban     urban areas.
#               https://www.census.gov/programs-surveys/geography/guidance/geo-areas/urban-rural.html
#
# DC is the one exception: NOAA publishes no statewide series for it, so its
# temperature is the Washington Reagan National station normal (USW00013743,
# 1991-2020) rather than an areal average. DC is small enough that a single
# station covers it about as well as an areal mean would.
#   https://www.ncei.noaa.gov/access/services/data/v1?dataset=normals-monthly-1991-2020&stations=USW00013743&format=pdf&startDate=0001-01-01&endDate=9996-12-31
#
# These are STATE AVERAGES and the dashboard only knows an order's state, so every
# panel built on them is a weak proxy. Each is weak in its own way:
#
# elevation — the area-weighted mean is the standard figure and is robust to a
#   lone tall peak, since a summit covers negligible area (Mt. Rainier leaves WA
#   at ~1,700 ft). Two alternatives that sound better are worse: relief (high
#   point - low point) is defined purely by two extremes, which would rank
#   California the most mountainous state in the country off Whitney and Badwater
#   alone; median elevation is more robust still but is not published — it needs a
#   digital elevation model. The real gap is that terrain elevation is not where
#   people live: California's terrain mean is ~2,900 ft while most Californians
#   live near sea level.
#
# percent urban — this is here INSTEAD of population density, which was tried
#   first and mis-sorts exactly the states that matter. Raw density divides by the
#   whole state, so a big one-metro state reads rural: Nevada is 28/sq mi and about
#   94% urban, with Utah, Idaho and Oregon the same shape. Census
#   population-weighted ("perceived") density would be the ideal figure, but there
#   is no maintained state-level table to take it from, and it spans 100-50,000 so
#   a sourcing error would reshuffle the bins wholesale. Percent urban is bounded
#   0-100 and binned into four bars, so it stays robust to a few points of error.
#   What it cannot do is separate a dense-city resident from a small-town one —
#   both count as urban.
#
# temperature — a statewide annual mean flattens both altitude and season, so a
#   Flagstaff order and a Phoenix order are charted at the same figure.
#
# Canadian provinces are deliberately absent: provincial averages span too much
# ground to mean anything (BC alone runs from rainforest coast to alpine
# interior), and inventing them would look like data. Orders there fall into an
# explicit "no data" bar instead of being dropped or guessed at.
