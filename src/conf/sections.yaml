# R2 Orders — the page's sections, in display order.
#
# Each section's number (its heading and the sidebar link, and the #sec-N anchor
# people link to) comes from its position here, so reordering this list is all it
# takes; grouped as build -> timing -> production/VIN -> geography. The summary
# (section 1) and the data-quality panel (last) are built by page.py around these.
#
#   title   heading and sidebar label
#   desc    what the section shows, under the heading: brief, no design rationale,
#           nothing the charts already say. HTML, so <strong>, <em>, <br> and
#           links work and & must be written &amp;. Folded (">-"), so line breaks
#           here are just spaces in the page.
#   howto   optional: how to use the section's own controls, shown only when
#           scripts run. Hovering, legends and zoom are explained once, in §1.
#   components  presentation-layer components, by id (charts.yaml), in order
#   layout  how the components sit: grid (default: two across when there's room),
#           fit (side by side at equal widths until a panel's content wouldn't
#           fit, then one across: for tables, which shouldn't scroll), single
#           (always one across)
#
# Editing prose or order is a data edit here, not a code change.

sections:

  - title: "Configuration take-rates"
    components: [takerate-color, takerate-wheels, takerate-interior,
                 takerate-buylease, takerate-spare, takerate-r1]
    desc: >-
      What the cohort ordered, each bar split by delivery stage. A panel counts
      the orders that answered its question, except the compact spare, where no answer
      counts as No. Trim, Launch Package, Autonomy+ and Tow are near-universal, so they
      have no panel yet.

  - title: "Configuration combinations"
    components: [combo-wheels, combo-interior]
    layout: fit
    desc: >-
      Which options are ordered together: paint with wheels, and paint with
      interior.

  - title: "Configured price"
    components: [price-distribution, price-options, price-by-trim]
    layout: single
    desc: >-
      What the cohort is paying for the configured vehicle, from Rivian's
      published trim and option prices, without destination, doc fees, taxes or
      incentives. Orders with an option Rivian hasn't priced are left out and listed in
      the data-quality panel.

  - title: "Reservation & order timeline"
    components: [reservations-by-week, orders-by-week]
    desc: >-
      Reservations by the week they were made, split by whether the holder has
      ordered since; then orders by the week they were placed, split by how far each has
      got today.

  - title: "Fulfilment"
    components: [fulfilment-by-week]
    desc: >-
      Every order's progress, week by week, from the dates it was given a VIN,
      had its delivery scheduled and was delivered. A VIN or date with no known date of
      its own counts from the latest week. <strong>Deliveries are inferred, not
      reported:</strong> an order counts as delivered once its whole delivery estimate
      has passed, VIN or not. That errs both ways: a delayed car still looks delivered,
      and one that arrived early against a vague estimate doesn't. The data-quality
      panel lists the deliveries inferred from a window, range or month.

  - title: "Order-to-delivery time"
    components: [delivery-latency, latency-coverage]
    desc: >-
      How long orders with a firm delivery date wait between order and delivery.
      <strong>Read the recent end with care:</strong> firm dates arrive close to
      delivery, so the latest order weeks show mostly their fastest deliveries, and
      their median will rise as the rest are scheduled. The chart below shows how much
      of each week's orders have a firm date.

  - title: "VIN sequence vs. order date"
    components: [vin-vs-order]
    desc: >-
      Each order's VIN against its order date: whether ordering earlier gets an
      earlier build slot.

  - title: "Delivery date vs. VIN sequence"
    components: [delivery-vs-vin, build-cadence]
    desc: >-
      Each order with a VIN and a delivery estimate; whiskers span its quoted
      delivery window. The <em>build front</em> is the 90th-percentile VIN delivered each
      finished week, from firm dates: roughly how far production has reached. The
      dashed line projects it at the current rate, and the band is how far that
      projection has missed before. It leans upward because production has ramped in
      steps, so past projections have mostly fallen behind. It shows where production
      is heading, not when any one order will arrive. Below, the build rate over
      time.

  - title: "VIN sequence by configuration"
    components: [vin-by-config]
    desc: >-
      Each order with a VIN at its place in the build sequence, in a row per
      full configuration: trim, paint, wheels and interior.

  - title: "Geographic demand"
    components: [geo-demand, state-mix]
    desc: >-
      Demand by state around the Normal, IL plant, shaded on a square-root
      scale. Below, a state's orders by status, paint, wheels or interior, against the
      US overall.
    howto: >-
      Select a state on the map, or pick one, to see its orders; <em>Show
      all</em> lists every state with 10 or more.

  - title: "Wheels by climate & terrain"
    components: [wheels-by-elevation, wheels-by-temperature, wheels-by-urban]
    desc: >-
      Wheel choice by the destination state's mean elevation, average
      temperature and urban share. Every order takes its state's average, so a
      difference here can't say why: terrain, driving mix and when each wheel was
      orderable all play a part. Sources: <a href="https://pubs.usgs.gov/pp/1200us/report.pdf"
      target="_blank" rel="noopener">USGS</a> mean elevation, <a
      href="https://www.ncei.noaa.gov/access/monitoring/climate-at-a-glance/"
      target="_blank" rel="noopener">NOAA</a> 1991&ndash;2020 annual mean temperature
      (DC: the <a
      href="https://www.ncei.noaa.gov/access/services/data/v1?dataset=normals-monthly-1991-2020&amp;stations=USW00013743&amp;format=pdf&amp;startDate=0001-01-01&amp;endDate=9996-12-31"
      target="_blank" rel="noopener">Reagan National normal</a>), and <a
      href="https://www.census.gov/programs-surveys/geography/guidance/geo-areas/urban-rural.html"
      target="_blank" rel="noopener">Census 2020</a> urban share.
