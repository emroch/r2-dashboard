# R2 Orders — the page's sections, in display order.
#
# Each section's number (its heading and the sidebar link, and the #sec-N anchor
# people link to) comes from its position here, so reordering this list is all it
# takes; grouped as build -> timing -> production/VIN -> geography. The summary
# (section 1) and the data-quality panel (last) are built by page.py around these.
#
#   title   heading and sidebar label
#   desc    the prose under the heading. HTML, so <strong>, <em>, <br> and links
#           work and & must be written &amp;. Folded (">-"), so line breaks here
#           are just spaces in the page.
#   components  presentation-layer components, by id (charts.yaml), in order
#   layout  how the components sit: grid (default: two across when there's room),
#           fit (side by side at equal widths until a panel's content wouldn't
#           fit, then one across: for tables, which shouldn't scroll), single
#           (always one across)
#   charts  Plotly figure builders in render/charts.py, by name, drawn after the
#           components. Each goes as its section moves to components
#           (docs/presentation.md).
#
# Editing prose or order is a data edit here, not a code change.

sections:

  - title: "Configuration take-rates"
    components: [takerate-color, takerate-wheels, takerate-interior,
                 takerate-buylease, takerate-spare, takerate-r1]
    desc: >-
      What this cohort ordered. Each panel counts the orders that answered its
      question, so an unanswered one sits out rather than forming a blank row; the
      data-quality panel lists the orders that never reported their build. Every
      bar is split by how far those orders have got: delivered, delivery
      scheduled, assigned a VIN, or still waiting for one. Paints are ordered by
      how many chose them; wheels, interiors and the yes/no answers keep their
      natural order. For the compact spare an unanswered question means not opted
      in, so those count as No. Trim, Launch Package, Autonomy+ and Tow are ~100%
      uniform across the cohort, so they have no panel yet.

  - title: "Configuration combinations"
    components: [combo-wheels, combo-interior]
    layout: fit
    desc: >-
      Which options people pair together, as counts per pairing: exterior paint
      against wheels, then against interior. Each cell gives its count as well as
      its shade, since at these volumes a 1 and a 3 look alike by color alone, and
      the totals sit at the edges. Paints run most-ordered first, as everywhere on
      the page. Only options that have actually been ordered get a column, so the
      grid fills out as trims and configs open up rather than showing empty rows in
      advance. A pairing needs both halves, so an order that hasn't reported one of
      them isn't in that grid.

  - title: "Configured price"
    components: [price-distribution, price-options, price-by-trim]
    layout: single
    desc: >-
      What this cohort is paying, from published trim and option prices — the
      configured vehicle only, with no destination, doc fees, taxes, or incentives.
      The first panel gives one bar per exact price, highest first (the cohort lands
      on a small set of totals, so binning would hide real structure), with the
      median's row highlighted. The second covers the option spend alone — the base is
      a constant per trim, so the choices are the interesting part — with each
      category's take rate alongside, since a big average means something different
      when everyone pays a little rather than a few paying a lot. The last is a strip
      per trim: the whiskers span the cheapest to the dearest order, the box the
      middle half, with the median and mean marked and every value written out. It
      fills in as Premium and Standard ship. Orders whose configuration hits a price
      Rivian hasn't published are excluded rather than counted as zero — see the
      data-quality panel.

  - title: "Reservation & order timeline"
    charts: [fig_order_timeline]
    desc: >-
      The top panel stacks reservation-only holders (incomplete orders, from the
      separate reservations sheet) above those who have since locked an order. The
      3/7/2024 reveal week is ~20x the next-biggest week, so the y-axis is clipped
      just above the tail to keep the 2-year trickle readable. The bottom shows when
      orders were finalized.

  - title: "Estimated delivery timeline"
    charts: [fig_delivery_timeline]
    desc: >-
      When the cohort expects delivery, stacked by how firm the estimate is.

  - title: "Order-to-delivery time"
    charts: [fig_delivery_latency]
    desc: >-
      How long people wait between placing an order and delivery, for orders with a
      firm delivery date — a range or window is a guess, so its midpoint would claim
      precision it doesn't have. Each point is one order, at its order date; filled
      points are dates that have passed (presumed delivered) and open points are
      scheduled in the future. The line is the weekly median, drawn only for weeks
      with at least three firm dates. <strong>Read the recent end with
      care.</strong> A firm date usually only appears once delivery is close, so the
      latest order weeks are represented mainly by their <em>fast</em> deliveries —
      their slower orders haven't been scheduled yet. The bottom panel shows how
      much of each week's orders the points above actually cover; where it is low,
      the median is biased short and will likely rise as the rest report. Estimates
      that contradict the order date are left out and listed in the data-quality
      panel.

  - title: "Estimate certainty vs. VIN status"
    components: [certainty-by-vin]
    desc: >-
      How firm each order's delivery estimate is, for orders with a VIN and for
      those still waiting for one. Each row is 100% of its orders, so the two
      compare by share even though they differ in size; the counts are on each row.
      A firm date usually arrives with or after the VIN.

  - title: "VIN sequence vs. order date"
    charts: [fig_vin_vs_order]
    desc: >-
      Does ordering earlier win a lower (earlier-built) VIN? Slope/scatter shows how
      tightly production sequence tracks order timing. Click a config in the legend
      to hide it, or double-click to isolate one.

  - title: "Delivery date vs. VIN sequence"
    components: [delivery-vs-vin]
    charts: [fig_vin_cadence]
    desc: >-
      Each point is an order with both a VIN and a delivery estimate. Color = paint,
      marker shape = wheels; whiskers span the quoted delivery window. Clusters of
      one color across a VIN range hint at same-config cars built in sequence. Click
      a legend entry to hide it, or double-click to isolate it; pinch (or hold ⌘/Ctrl
      and scroll) to zoom, drag to pan, and double-click the chart (or Reset view)
      to return.
      <br><br>The
      yellow line is the <em>build front</em>: the 90th-percentile VIN delivered
      each finished week, from firm delivery dates only. Delivery stands in for
      build date — the lag between them moves where a VIN appears but not the slope,
      which is the build rate — and the high percentile tracks the newest cars
      arriving rather than the held-back ones still trickling in. The dashed line
      projects the front a few weeks ahead at the current rate, and the shaded band
      is how far off that same projection has actually been, measured by re-running
      it from earlier weeks on every build. It is an aggregate only: where the front
      is heading, not when any particular order will arrive. <br><br><strong>The
      band leans upward on purpose.</strong> Production is still ramping, and so far
      it has ramped in steps — cadence more than doubled in two weeks in mid-August
      — so past projections have almost always fallen <em>behind</em> what actually
      happened, rarely ahead. Each side of the band is the typical miss in that
      direction, so the upper side is the room for another step up. The line itself
      stays at the current rate deliberately: models that extrapolate the ramp were
      tested and did worse, carrying August's jump into September's plateau. The
      band narrows on its own as weeks at a steady rate accumulate. Below, the rate
      itself over time.

  - title: "VIN sequence by configuration"
    charts: [fig_vin_by_config]
    desc: >-
      Each VIN-assigned order at its production sequence (x), grouped into rows by
      full configuration (trim · color · wheels · interior); marker fill = paint,
      shape = wheels. Clusters along a row suggest same-config cars were built in a
      batch. Interior is part of the row key rather than a third marker encoding,
      since fill and shape are already taken and a third cue on a 10px marker would
      be guesswork; rows appear only for configurations that have a VIN, so the
      newer cabins show up here as their orders get assigned.

  - title: "Geographic demand"
    charts: [fig_geo]
    desc: >-
      Three stacked maps of demand around the Normal, IL plant: orders with an
      assigned VIN, all orders, and total demand (orders + incomplete reservations).
      Bubble area = count; the first two share a scale, while total demand (~20x
      larger) scales to its own. The bars beside each map give that panel's
      per-region total.

  - title: "Orders by state"
    components: [state-totals]
    desc: >-
      Every state that has ordered, largest first, each bar split by how far its
      orders have got: delivered, delivery scheduled, assigned a VIN, or still waiting
      for one, the same four stages as the take-rate bars and the summary. Bar length
      is the state's order count. Deliveries are <em>inferred</em>, not reported — an
      order whose whole delivery estimate has passed is assumed to have arrived, on
      the theory that people rarely come back to update the sheet afterwards. That is
      rough and errs both ways: a delayed car still looks delivered, and one that
      arrived early against a vague estimate does not. Any estimate with a known end
      date counts, including a relative window that finished a while ago; orders with
      no estimate never do. Deliveries count whether or not a VIN is known, since some
      people post about taking delivery without ever updating their VIN. The top row
      sums every state on its own scale — at the shared one it would flatten every
      other bar — and equals the summary's delivery progress, counted over the orders
      with a known state.

  - title: "Paint preference by location"
    components: [paint-by-region, paint-by-state]
    desc: >-
      Does color taste vary geographically? Each row is 100% of its orders, so a
      region's or state's paint mix compares regardless of order volume — the West has
      ~70x Canada's. The <em>All orders</em> row on top is the baseline: read a row
      against it to see which paints that group over- or under-indexes on, and the
      summary names the biggest lean among groups of 20 or more orders. Every row
      gives its n and its counts. The state panel is limited to states with enough
      orders to be meaningful; below that a single order swings the mix by 100 points,
      so the rest stay summarized in the region panel.

  - title: "Wheel preference by location"
    components: [wheels-by-region, wheels-by-elevation, wheels-by-temperature,
                 wheels-by-urban]
    desc: >-
      Wheel choice for every order with a known state, as 100% rows per group so
      rows compare regardless of order volume; each panel's <em>All orders</em> row
      is the whole cohort, a baseline to read the others against, and every row
      gives its n and its counts. The elevation, temperature and urban-share panels
      order their rows by <em>value</em> rather than by volume. Sources, all per-state published
      figures: <a href="https://pubs.usgs.gov/pp/1200us/report.pdf" target="_blank"
      rel="noopener">USGS</a> mean state elevation (area-weighted), <a
      href="https://www.ncei.noaa.gov/access/monitoring/climate-at-a-glance/"
      target="_blank" rel="noopener">NOAA</a> statewide annual mean temperature over
      the 1991&ndash;2020 normals, and the <a
      href="https://www.census.gov/programs-surveys/geography/guidance/geo-areas/urban-rural.html"
      target="_blank" rel="noopener">Census 2020</a> urban share of population
      &mdash; except DC, which has no NOAA statewide series and uses the <a
      href="https://www.ncei.noaa.gov/access/services/data/v1?dataset=normals-monthly-1991-2020&amp;stations=USW00013743&amp;format=pdf&amp;startDate=0001-01-01&amp;endDate=9996-12-31"
      target="_blank" rel="noopener">Reagan National station normal</a> instead.
      Because every order sits at its state's average rather than its own location,
      these panels can show <em>that</em> a group's mix differs &mdash; not why.
      Read any lean as a prompt to look closer, not a finding: the all-season versus
      all-terrain efficiency argument carries confounds &mdash; local terrain,
      driving mix, when each wheel was orderable &mdash; that state averages cannot
      separate.

  - title: "Interior preference by location"
    components: [interior-by-region]
    desc: >-
      Interior mix by region, read the same way as the paint and wheel panels above:
      each row is 100% of its orders so a region's mix compares regardless of order
      volume, the <em>All orders</em> row on top is the baseline, and every row gives
      its n and its counts. Region only, no per-state row &mdash; the newer cabins are
      a small share of orders, and split by state most rows would hold one or two of
      them, where a single order swings the mix by 100 points.

  - title: "Destination vs. delivery date"
    charts: [fig_dest_vs_delivery]
    desc: >-
      States ordered by distance from the Normal, IL plant (closest at bottom). An
      upward-right tilt would mean farther destinations deliver later. Whiskers span
      each order's quoted delivery window. Click a region in the legend to hide it,
      or double-click to isolate one.
